<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Koleksi proyek game development, shader, dan tools oleh AW WorkLab.">
    <title>Works | AW WorkLab</title>
    
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <a href="index.html">
                <img src="images/logo.png" alt="AW WorkLab Logo">
            </a>
        </div>

        <button class="menu-toggle" id="menu-open" aria-label="Open Menu">
            <i class="fas fa-bars"></i>
        </button>

        <nav class="nav-links" id="side-menu">
            <button class="menu-close" id="menu-close" aria-label="Close Menu">
                <i class="fas fa-times"></i>
            </button>
            <a href="index.html">Home</a>
            <a href="works.html" class="active">Works</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="nav-overlay" id="nav-overlay"></div>
    </header>

    <main class="content">
        <div class="portfolio-filter">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="cat-portfolio">Portfolio</button>
            <button class="filter-btn" data-filter="cat-games">Games</button>
            <button class="filter-btn" data-filter="cat-other">Other Works</button>
        </div>

        <div class="blog-grid portfolio-grid" id="portfolio-grid">
            <article class="blog-card filter-item cat-portfolio">
                <a href="post.html" class="post-link">
                    <div class="image-wrapper">
                        <img src="images/p1.jpg" alt="Shader Project Preview">
                    </div>
                    <time datetime="2026-02-20">Feb 20, 2026</time>
                    <h2>Shader Project</h2>
                </a>
            </article>

            <article class="blog-card filter-item cat-games">
                <a href="post.html" class="post-link">
                    <div class="image-wrapper">
                        <img src="images/g1.jpg" alt="Balatro Mobile Gameplay">
                    </div>
                    <time datetime="2026-02-15">Feb 15, 2026</time>
                    <h2>Balatro Mobile</h2>
                </a>
            </article>

            <article class="blog-card filter-item cat-other">
                <a href="post.html" class="post-link">
                    <div class="image-wrapper">
                        <img src="images/o1.jpg" alt="Rigging Tools Demo">
                    </div>
                    <time datetime="2026-01-10">Jan 10, 2026</time>
                    <h2>Rigging Tools</h2>
                </a>
            </article>
        </div>
    </main>

    <footer class="footer-simple">
        <div class="social-icons">
            <a href="https://facebook.com" target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="https://instagram.com" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://linkedin.com" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            <a href="https://x.com" target="_blank" aria-label="X (Twitter)"><i class="fab fa-x-twitter"></i></a>
            <a href="https://youtube.com" target="_blank" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
        </div>
        <p>© 2026 AW WorkLab. All rights reserved.</p>
    </footer>

    <script>
        // --- NAVBAR LOGIC ---
        const menuOpen = document.getElementById('menu-open');
        const menuClose = document.getElementById('menu-close');
        const sideMenu = document.getElementById('side-menu');
        const overlay = document.getElementById('nav-overlay');

        const toggleMenu = (isOpen) => {
            sideMenu.classList.toggle('active', isOpen);
            overlay.classList.toggle('active', isOpen);
            document.body.style.overflow = isOpen ? 'hidden' : 'auto';
        };

        menuOpen.onclick = () => toggleMenu(true);
        menuClose.onclick = () => toggleMenu(false);
        overlay.onclick = () => toggleMenu(false);

        // --- FILTER LOGIC ---
        const filterBtns = document.querySelectorAll('.filter-btn');
        const filterItems = document.querySelectorAll('.filter-item');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // 1. Ubah status active tombol
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // 2. Filter item
                const filterValue = btn.getAttribute('data-filter');

                filterItems.forEach(item => {
                    // Reset animasi
                    item.style.animation = 'none';
                    item.offsetHeight; // trigger reflow
                    item.style.animation = 'fadeIn 0.5s ease forwards';

                    if (filterValue === 'all' || item.classList.contains(filterValue)) {
                        item.style.display = 'flex';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        });
    </script>

</body>
</html>
